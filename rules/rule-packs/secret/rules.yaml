id: secret
version: 1.0.0
issue_types: [secret]
prompt: triage
severity_map:               # gitleaks rule id -> normalised scanner severity (adapter uses this)
  aws-access-token: high
  azure-ad-client-secret: high
  github-pat: high
  private-key: critical
  stripe-access-token: medium
  generic-api-key: medium
  default: high
suppression_rules:
  - id: test-fixture-test-key
    description: Secret sits only in a test fixture path AND the value has a non-production test-key prefix (e.g. sk_test_).
    path_glob: ["tests/**", "**/Fixtures/**", "**/fixtures/**"]
    attribute: { key: test_key_prefix, equals: "true" }
    max_severity: medium
bucket_rules:
  fix_now: [critical, high]
  fix_batch: [medium, low, info]
guidance: |
  - A credential committed in application configuration or source is a real issue, even if it looks fake: treat as leaked; it must be removed and rotated by the owner team.
  - Never lower the effective severity of a secret below the scanner severity.
  - Only suggest suppress when a suppression rule above matched (evidence required) and severity is medium or lower.
