# EXAMPLE ONLY: not active (GitHub ignores workflows in sub-folders). Copy into the application repo's .github/workflows/.
#
# Backlog mode: a nightly full scan of main produces SARIF (supported outside PR context) and pushes it with NO PR number.
# The agent stores it and records the intake as backlog_pending (slice 1 has no backlog runner yet; see docs/intake.md).
# Same secrets as blackduck-push.yml: INTAKE_URL, INTAKE_HMAC_SECRET.
name: blackduck-nightly-main (example)

on:
  schedule:
    - cron: '30 20 * * *'      # 20:30 UTC = 02:00 IST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  blackduck-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # PLACEHOLDER: your existing Black Duck step, in FULL (intelligent) mode with SARIF output, e.g.:
      # - uses: blackduck-inc/black-duck-security-scan@v2
      #   with:
      #     blackducksca_url: ${{ vars.BLACKDUCK_URL }}
      #     blackducksca_token: ${{ secrets.BLACKDUCK_TOKEN }}
      #     blackducksca_scan_full: true
      #     blackducksca_reports_sarif_create: true
      #     blackducksca_reports_sarif_file_path: ${{ runner.temp }}/blackduck.sarif.json
      #     blackducksca_reports_sarif_groupSCAIssues: true      # one SARIF rule per component (the parser keeps that grouping)

      - name: Sign and push SARIF (backlog mode, no PR)
        shell: bash
        env:
          INTAKE_URL: ${{ secrets.INTAKE_URL }}
          INTAKE_HMAC_SECRET: ${{ secrets.INTAKE_HMAC_SECRET }}
          RESULT_FILE: ${{ runner.temp }}/blackduck.sarif.json
          RESULT_FORMAT: sarif
          SA_REPO: ${{ github.repository }}
          SA_PR: ''
          SA_REF: main
          SA_SHA: ${{ github.sha }}
          SA_SCANNER: blackduck
          SA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${INTAKE_URL:?INTAKE_URL secret is not set}" "${INTAKE_HMAC_SECRET:?INTAKE_HMAC_SECRET secret is not set}"
          ts=$(date +%s)
          body_sha=$(sha256sum "${RESULT_FILE}" | cut -d' ' -f1)
          sig=$(TS="${ts}" BODY_SHA="${body_sha}" python3 -c '
          import hashlib, hmac, os
          e = os.environ
          parts = ["secagent-intake-v1", e["TS"], e["RESULT_FORMAT"], e["SA_REPO"], e.get("SA_PR", ""), e.get("SA_REF", ""),
                   e["SA_SHA"], e["SA_SCANNER"], e["SA_RUN_ID"], e["BODY_SHA"]]
          print(hmac.new(e["INTAKE_HMAC_SECRET"].encode(), "\n".join(parts).encode(), hashlib.sha256).hexdigest())')
          status=$(curl -sS -o "${RUNNER_TEMP:-/tmp}/intake-response.json" -w '%{http_code}' --max-time 120 --retry 3 --retry-all-errors \
            -X POST "${INTAKE_URL%/}/api/intake/${RESULT_FORMAT}" \
            -H 'Content-Type: application/sarif+json' \
            -H "X-SecAgent-Timestamp: ${ts}" \
            -H "X-SecAgent-Signature-256: sha256=${sig}" \
            -H "X-SecAgent-Repo: ${SA_REPO}" \
            -H "X-SecAgent-Ref: ${SA_REF}" \
            -H "X-SecAgent-Head-Sha: ${SA_SHA}" \
            -H "X-SecAgent-Scanner: ${SA_SCANNER}" \
            -H "X-SecAgent-Run-Id: ${SA_RUN_ID}" \
            --data-binary "@${RESULT_FILE}")
          cat "${RUNNER_TEMP:-/tmp}/intake-response.json"; echo
          case "${status}" in 200|202) echo "intake: HTTP ${status}" ;; *) echo "::error::intake returned HTTP ${status}"; exit 1 ;; esac
